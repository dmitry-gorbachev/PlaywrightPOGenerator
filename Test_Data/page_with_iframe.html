<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page with Iframe</title>
</head>
<body>
    <h1>Product Page</h1>

    <section>
        <h2>Demo Video</h2>
        <iframe
            id="demoVideo"
            title="Product Demo Video"
            src="https://www.youtube.com/embed/dQw4w9WgXcQ"
            width="560"
            height="315"
        ></iframe>
    </section>

    <section>
        <h2>Customer Reviews</h2>
        <iframe
            id="reviewWidget"
            src="https://reviews.example.com/widget"
            title="Customer Reviews Widget"
        ></iframe>
    </section>

    <button id="watchDemoButton">Watch Demo</button>
    <a href="/reviews">View All Reviews</a>
</body>
</html>
