<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Card</title>
</head>
<body>
    <div class="product-card" data-testid="product-001">
        <img src="product.jpg" alt="Product Image">
        <h3>Awesome Product</h3>
        <p class="price">$29.99</p>
        <p class="description">A great product for everyone</p>
        <button class="add-to-cart" aria-label="Add Awesome Product to cart">Add to Cart</button>
        <button class="favorite" aria-label="Add to favorites">♥</button>
    </div>
</body>
</html>
