<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Disabled and Hidden Elements</title>
</head>
<body>
    <h1>Form with Disabled/Hidden Elements</h1>
    <form>
        <label for="enabled">Enabled Field:</label>
        <input id="enabled" type="text">

        <label for="disabled">Disabled Field:</label>
        <input id="disabled" type="text" disabled>

        <label for="hidden">Hidden Field:</label>
        <input id="hidden" type="text" style="display: none;">

        <button type="submit">Submit</button>
        <button type="button" disabled>Disabled Button</button>
    </form>
</body>
</html>
