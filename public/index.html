<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playwright Page Object Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 40px;
            min-height: 600px;
        }

        @media (max-width: 1200px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            display: flex;
            flex-direction: column;
        }

        .panel h2 {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 200px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #ddd;
            margin-bottom: 15px;
        }

        .tab-button {
            flex: 1;
            padding: 12px;
            background: #f5f5f5;
            border: none;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .tab-button.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
            margin-bottom: -1px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .file-upload {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-upload input[type="file"] {
            display: none;
        }

        .file-upload label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            border: 2px dashed #667eea;
            border-radius: 6px;
            background: #f9f9ff;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-upload label:hover {
            background: #f0f0ff;
            border-color: #764ba2;
        }

        .checkbox-group {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        input[type="checkbox"] {
            cursor: pointer;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .code-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 400px;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .code-info {
            font-size: 0.9em;
            color: #666;
        }

        .code-actions {
            display: flex;
            gap: 10px;
        }

        .code-actions button {
            flex: none;
            padding: 8px 15px;
            font-size: 0.9em;
        }

        pre {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            overflow-x: auto;
            flex: 1;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            line-height: 1.5;
            color: #333;
        }

        .warning-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-size: 0.9em;
            color: #856404;
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-size: 0.9em;
            color: #1565c0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .extracted-elements {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 15px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.9em;
        }

        .element-item {
            padding: 5px 0;
            color: #555;
            border-bottom: 1px solid #eee;
        }

        .element-item:last-child {
            border-bottom: none;
        }

        .element-badge {
            display: inline-block;
            padding: 2px 6px;
            background: #667eea;
            color: white;
            border-radius: 3px;
            font-size: 0.8em;
            font-weight: 600;
            margin-right: 5px;
        }

        .footer {
            background: #f5f5f5;
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 0.9em;
            border-top: 1px solid #ddd;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .content {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
            }

            .code-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎭 Playwright Page Object Generator</h1>
            <p>Generate production-ready Page Object classes from HTML</p>
        </div>

        <div class="content">
            <!-- Input Panel -->
            <div class="panel input-panel">
                <h2>Input HTML</h2>

                <div class="tabs">
                    <button class="tab-button active" data-tab="paste-tab">Paste HTML</button>
                    <button class="tab-button" data-tab="upload-tab">Upload File</button>
                </div>

                <!-- Paste Tab -->
                <div id="paste-tab" class="tab-content active">
                    <div class="form-group">
                        <label for="htmlInput">Paste your HTML:</label>
                        <textarea id="htmlInput" placeholder="Paste HTML snippet here..."></textarea>
                    </div>
                </div>

                <!-- Upload Tab -->
                <div id="upload-tab" class="tab-content">
                    <div class="form-group">
                        <div class="file-upload">
                            <input type="file" id="fileInput" accept=".html">
                            <label for="fileInput">
                                📁 Click to upload or drag & drop HTML file
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Options -->
                <div class="form-group">
                    <label for="language">Output Language:</label>
                    <select id="language">
                        <option value="typescript">TypeScript (Playwright Test)</option>
                        <option value="javascript">JavaScript</option>
                        <option value="python">Python (pytest-playwright)</option>
                        <option value="java">Java</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="className">Class Name (optional):</label>
                    <input type="text" id="className" placeholder="Auto-derived from HTML title...">
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="includeSampleTest">
                        Include sample test
                    </label>
                </div>

                <!-- Action Buttons -->
                <div class="button-group">
                    <button class="btn-primary" id="generateBtn">Generate</button>
                    <button class="btn-secondary" id="clearBtn">Clear</button>
                </div>

                <!-- Loading Indicator -->
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Generating...</p>
                </div>
            </div>

            <!-- Output Panel -->
            <div class="panel output-panel">
                <h2>Generated Page Object</h2>

                <!-- Warnings -->
                <div id="warnings" class="hidden">
                    <div class="warning-box" id="warningsContent"></div>
                </div>

                <!-- Extracted Elements -->
                <div id="elementsContainer" class="hidden">
                    <div class="info-box">
                        <strong>Extracted Elements:</strong> <span id="elementCount">0</span>
                    </div>
                    <div class="extracted-elements" id="extractedElements"></div>
                </div>

                <!-- Code Display -->
                <div class="code-container">
                    <div class="code-header">
                        <div class="code-info">
                            Class: <strong id="classNameDisplay">-</strong>
                        </div>
                        <div class="code-actions">
                            <button class="btn-secondary" id="copyBtn">📋 Copy</button>
                            <button class="btn-secondary" id="downloadBtn">⬇️ Download</button>
                        </div>
                    </div>
                    <pre id="codeOutput">// Generated code will appear here...</pre>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>Playwright Page Object Generator v1.0 | Generate semantic, maintainable test code</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
